plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.owasp.dependencycheck' version '12.1.0'
	id 'org.sonarqube' version '4.3.0.3225'
}

group = 'com.spring.boot.mysql'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	implementation("org.springframework.boot:spring-boot-starter-web")
	implementation("org.springframework.boot:spring-boot-starter-validation")
	implementation("org.slf4j:slf4j-api:2.1.0-alpha1")
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

dependencyCheck {
	failBuildOnCVSS = 7 // Fail the build if vulnerabilities with CVSS >= 7 are found
	suppressionFile = 'dependency-check-suppressions.xml' // Optional suppression file
	analyzers.assemblyEnabled = false
	analyzers.nugetconfEnabled = false
	analyzers.nodeEnabled = false
	analyzers.retirejs.enabled = false
}
